name: Probe public API edge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Probe public endpoints
        run: node scripts/probe-edge.mjs
      - name: Update status files via Contents API
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          set -euo pipefail
          # Update both status files via the Contents API. Admin PAT is used so
          # the protected-branch status check ("audit") does not block status-only
          # updates; the site-audit workflow still runs on every push to main.
          for path in data/status.json _data/status.json; do
            sha=$(gh api "repos/KKWANG4444/api-status/contents/${path}?ref=main" --jq .sha)
            gh api -X PUT "repos/KKWANG4444/api-status/contents/${path}" \
              -f message="chore: update public edge status" \
              -f content="$(base64 < "${path}" | tr -d '\n')" \
              -f sha="${sha}" \
              -f branch="main" --jq '.commit.sha[0:7]'
          done
