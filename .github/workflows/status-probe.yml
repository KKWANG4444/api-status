name: Probe public API edge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Probe public endpoints
        run: node scripts/probe-edge.mjs
      - name: Commit current status
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _data/status.json data/status.json
          if git diff --cached --quiet; then
            echo 'No status change to commit.'
          else
            git commit -m 'chore: update public edge status'
            git push
          fi
