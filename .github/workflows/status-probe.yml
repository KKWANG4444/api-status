name: Probe public API edge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-status-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Probe public endpoints
        run: node scripts/probe-edge.mjs
      - name: Update status files via Contents API
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          set -euo pipefail
          # Commit both generated files together. Two Contents API PUTs create
          # two commits and two Pages builds, which can leave deploy-pages with
          # multiple github-pages artifacts from the same probe cycle.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json _data/status.json
          if git diff --cached --quiet; then
            echo "No status changes to publish"
            exit 0
          fi
          git commit -m "chore: update public edge status"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
